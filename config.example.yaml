# ═══════════════════════════════════════════════════════════
# Morning Brief — Configuration
# Copy this file to config.yaml and fill in your values.
# config.yaml is gitignored — never commit personal details.
# ═══════════════════════════════════════════════════════════

version: "1.0"

# ─── Gmail API ────────────────────────────────────────────
gmail:
  accounts:
    - email: "your-primary@gmail.com"
      credentials_path: "credentials/client_secret.json"
      token_path: "credentials/token_primary.json"
    # Add more accounts as needed:
    # - email: "your-secondary@gmail.com"
    #   credentials_path: "credentials/client_secret.json"
    #   token_path: "credentials/token_secondary.json"
  scopes:
    - "https://www.googleapis.com/auth/gmail.readonly"
    - "https://www.googleapis.com/auth/gmail.send"
    - "https://www.googleapis.com/auth/gmail.compose"
  fetch_window_hours: 24
  max_results: 200

# ─── LLM Backend ─────────────────────────────────────────
# Options: "ollama" (free, local) or "anthropic" (paid API)
llm:
  backend: "anthropic"

  ollama:
    model: "llama3.1:8b"
    base_url: "http://localhost:11434"
    # For better accuracy, try "llama3.1:70b" if your machine supports it

  anthropic:
    # Uses ANTHROPIC_API_KEY environment variable
    model: "claude-haiku-4-5-20251001"    # ~$0.03/month (recommended)
    # model: "claude-sonnet-4-6"           # ~$0.30/month (higher accuracy)
    max_tokens: 4096

# ─── Scoring Weights ─────────────────────────────────────
# Must sum to 1.0
scoring:
  urgency_weight: 0.35
  consequence_weight: 0.30
  relationship_weight: 0.20
  effort_weight: 0.15

# ─── Category Taxonomy ───────────────────────────────────
categories:
  tier1:  # ACTION REQUIRED TODAY
    - "deadlines_due_dates"
    - "payments_due"
    - "time_sensitive_replies"
    - "calendar_conflicts"
  tier2:  # IMPORTANT — ACT THIS WEEK
    - "professional_networking"
    - "financial_account_alerts"
    - "job_search_recruiting"
    - "property_management"
  tier3:  # AWARENESS
    - "newsletters_industry_news"
    - "personal_correspondence"
    - "academic_mba"
    - "receipts_confirmations"
  tier4:  # LOW PRIORITY / NOISE
    - "marketing_promotions"
    - "automated_notifications"
    - "spam_unsubscribe_candidates"

# ─── Sender Overrides ────────────────────────────────────
# Patterns that auto-escalate regardless of content
sender_overrides:
  # These senders are ALWAYS Tier 1 (add recruiters, hiring domains, family)
  tier1_always:
    - "*@greenhouse.io"
    - "*@lever.co"
    - "*@ashbyhq.com"
    # Add company domains you're targeting:
    # - "*@yourcompany.com"
    # Add family emails:
    # - "family@example.com"

  # These senders always go to Tier 4
  tier4_always:
    - "noreply@*"

# ─── Keyword Rules ───────────────────────────────────────
keywords:
  # These keywords add +20 to urgency score
  urgency_boost:
    - "urgent"
    - "deadline"
    - "overdue"
    - "final notice"
    - "action required"
    - "time-sensitive"
    - "expiring"
    - "past due"
    - "last chance"
    - "immediately"
    - "asap"

  # Payments/charges above this amount auto-escalate to Tier 2+
  financial_threshold_usd: 100

# ─── Delivery ────────────────────────────────────────────
delivery:
  # Options: "gmail", "telegram", "both"
  method: "both"

  gmail:
    send_to: "your-email@gmail.com"
    subject_template: "Morning Brief — {date}"

  telegram:
    # 1. Search @BotFather on Telegram, send /newbot
    # 2. Set via TELEGRAM_BOT_TOKEN environment variable
    bot_token: ""
    # 3. Set via TELEGRAM_CHAT_ID environment variable
    chat_id: ""

# ─── Schedule ────────────────────────────────────────────
schedule:
  time: "08:00"
  timezone: "America/Los_Angeles"

# ─── Logging ─────────────────────────────────────────────
logging:
  level: "INFO"
  file: "logs/morning-brief.log"

# ─── Personal Context (fed to the LLM) ──────────────────
# Describe your priorities so the AI can triage intelligently.
# Keep this generic — your real context lives in your local config.yaml only.
personal_context: |
  Describe your role, job search status, and email priorities here.
  Example: I'm actively job searching. Recruiter emails are top priority.
  I manage a rental property. Family emails are always important.
