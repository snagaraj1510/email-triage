# ═══════════════════════════════════════════════════════════
# Morning Brief v2 — Configuration
# Copy this file to config.yaml and fill in your values.
# config.yaml is gitignored — never commit personal details.
# ═══════════════════════════════════════════════════════════

version: "2.0"

# ─── Gmail API ────────────────────────────────────────────
gmail:
  accounts:
    - email: "your-primary@gmail.com"
      credentials_path: "credentials/client_secret.json"
      token_path: "credentials/token_primary.json"
    # Add more accounts:
    # - email: "your-secondary@gmail.com"
    #   credentials_path: "credentials/client_secret.json"
    #   token_path: "credentials/token_secondary.json"
  scopes:
    - "https://www.googleapis.com/auth/gmail.readonly"
    - "https://www.googleapis.com/auth/gmail.send"
    - "https://www.googleapis.com/auth/gmail.compose"
  fetch_window_hours: 24
  max_results: 200

# ─── Triage Agent ─────────────────────────────────────────
# Replaces the old LLM + scoring + sender_overrides + keywords sections.
# The agent reasons holistically — no hardcoded rules needed.
agent:
  model: "claude-haiku-4-5-20251001"     # ~$1/month (recommended)
  max_tokens: 8192
  temperature: 0.1
  max_retries: 2                          # Falls back to rule-based on failure
  escalation_model: "claude-sonnet-4-6"   # Used only if Haiku fails twice
  batch_size: 80                          # Max thread groups per LLM call

# ─── Draft Replies ────────────────────────────────────────
# Generates short draft replies for Tier 1 emails that need a human response.
# Drafts are pushed to your Gmail Drafts — never auto-sent.
drafts:
  enabled: true
  max_per_run: 5
  no_draft_categories:
    - "calendar_conflicts"
    - "payments_due"

# ─── Delivery ────────────────────────────────────────────
delivery:
  method: "both"    # "gmail", "telegram", or "both"
  gmail:
    send_to: "your-email@gmail.com"
    subject_template: "Morning Brief — {date}"
  telegram:
    bot_token: ""   # Set via TELEGRAM_BOT_TOKEN env var
    chat_id: ""     # Set via TELEGRAM_CHAT_ID env var

# ─── Schedule ────────────────────────────────────────────
schedule:
  time: "10:00"
  timezone: "America/New_York"

# ─── Logging ─────────────────────────────────────────────
logging:
  level: "INFO"
  file: "logs/morning-brief.log"

# ─── Personal Context ────────────────────────────────────
# Describe your priorities so the agent can triage intelligently.
# This is included in the triage prompt — be specific about what matters to you.
personal_context: |
  Describe your role, job search status, and email priorities here.
  Example: I'm actively job searching for strategy roles at tech companies.
  Recruiter emails and interview scheduling are top priority.
  I manage a rental property — tenant and HOA emails are important.
  Newsletters and marketing are low priority unless they contain a deadline.
