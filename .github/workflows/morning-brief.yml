name: Morning Brief

on:
  schedule:
    - cron: '0 14 * * *'  # 10am EDT (UTC-4, summer)
    - cron: '0 15 * * *'  # 10am EST (UTC-5, winter)
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  check-time:
    runs-on: ubuntu-latest
    outputs:
      is_10am: ${{ steps.check.outputs.is_10am }}
    steps:
      - id: check
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          echo "is_10am=$( [ "$HOUR" = "10" ] && echo true || echo false )" >> $GITHUB_OUTPUT

  morning-brief:
    needs: check-time
    if: needs.check-time.outputs.is_10am == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Gmail tokens
        # Store each account's token as a GitHub secret named GMAIL_TOKEN_1, GMAIL_TOKEN_2, etc.
        # See config.example.yaml for account setup instructions.
        run: |
          mkdir -p credentials
          echo '${{ secrets.GMAIL_TOKEN_1 }}' > credentials/token_account1.json
          echo '${{ secrets.GMAIL_TOKEN_2 }}' > credentials/token_account2.json
          echo '${{ secrets.GMAIL_TOKEN_3 }}' > credentials/token_account3.json
          echo '${{ secrets.GMAIL_TOKEN_4 }}' > credentials/token_account4.json

      - name: Run Morning Brief
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py
