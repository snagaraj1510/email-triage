name: Morning Brief

on:
  schedule:
    - cron: '0 13 * * *'     # 9 AM EDT (summer, UTC-4)
    - cron: '0 14 * * *'     # 9 AM EST (winter, UTC-5)
  workflow_dispatch:           # manual trigger from GitHub UI

permissions:
  contents: write              # needed to commit sender_history.json

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      # Time window guard: accept 9 AM – 1:59 PM ET (covers GH Actions cron drift)
      # Two crons handle DST; only one will land on hour 9.
      # Accept 8-10 AM ET to tolerate GitHub Actions cron drift.
      - name: Check time window
        id: timecheck
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          if [ "$HOUR" -ge 8 ] && [ "$HOUR" -le 10 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
            echo "Eastern hour=$HOUR — proceeding."
          else
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "Outside window (hour=$HOUR). Skipping to avoid duplicate run."
          fi

      - uses: actions/setup-python@v5
        if: steps.timecheck.outputs.proceed == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.timecheck.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      - name: Write config and credentials
        if: steps.timecheck.outputs.proceed == 'true'
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
          GMAIL_TOKEN_SN10019: ${{ secrets.GMAIL_TOKEN_SN10019 }}
          GMAIL_TOKEN_S_NAGARAJ1510: ${{ secrets.GMAIL_TOKEN_S_NAGARAJ1510 }}
          GMAIL_TOKEN_MULTISTAR1732: ${{ secrets.GMAIL_TOKEN_MULTISTAR1732 }}
          GMAIL_TOKEN_SHREYN_UMICH: ${{ secrets.GMAIL_TOKEN_SHREYN_UMICH }}
          SENDER_HISTORY: ${{ secrets.SENDER_HISTORY }}
        run: |
          printf '%s' "$CONFIG_YAML" > config.yaml
          mkdir -p credentials data
          printf '%s' "$GMAIL_TOKEN_SN10019"        > credentials/token_sn10019.json
          printf '%s' "$GMAIL_TOKEN_S_NAGARAJ1510"  > credentials/token_s_nagaraj1510.json
          printf '%s' "$GMAIL_TOKEN_MULTISTAR1732"  > credentials/token_multistar1732.json
          printf '%s' "$GMAIL_TOKEN_SHREYN_UMICH"   > credentials/token_shreyn_umich.json
          # Restore sender history (empty JSON object if secret not yet set)
          if [ -n "$SENDER_HISTORY" ]; then
            printf '%s' "$SENDER_HISTORY" > data/sender_history.json
          else
            echo '{"tier4_senders":{},"daily_stats":[]}' > data/sender_history.json
          fi

      - name: Run Morning Brief
        if: steps.timecheck.outputs.proceed == 'true'
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py

      - name: Persist sender history to secrets
        if: steps.timecheck.outputs.proceed == 'true' && always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          if [ -f data/sender_history.json ]; then
            gh secret set SENDER_HISTORY < data/sender_history.json || echo "Could not persist sender history (needs GH_PAT with secrets scope)"
          fi


  # ─── Weekly Rollup (Sundays) ───────────────────────────
  weekly-rollup:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 14 * * *'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Check if Sunday
        id: daycheck
        run: |
          DAY=$(TZ=America/New_York date +%u)
          if [ "$DAY" = "7" ]; then
            echo "is_sunday=true" >> $GITHUB_OUTPUT
          else
            echo "is_sunday=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.daycheck.outputs.is_sunday == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.daycheck.outputs.is_sunday == 'true'
        run: pip install -r requirements.txt

      - name: Write config and credentials
        if: steps.daycheck.outputs.is_sunday == 'true'
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
          GMAIL_TOKEN_SN10019: ${{ secrets.GMAIL_TOKEN_SN10019 }}
          GMAIL_TOKEN_S_NAGARAJ1510: ${{ secrets.GMAIL_TOKEN_S_NAGARAJ1510 }}
          SENDER_HISTORY: ${{ secrets.SENDER_HISTORY }}
        run: |
          printf '%s' "$CONFIG_YAML" > config.yaml
          mkdir -p credentials data
          printf '%s' "$GMAIL_TOKEN_SN10019"        > credentials/token_sn10019.json
          printf '%s' "$GMAIL_TOKEN_S_NAGARAJ1510"  > credentials/token_s_nagaraj1510.json
          if [ -n "$SENDER_HISTORY" ]; then
            printf '%s' "$SENDER_HISTORY" > data/sender_history.json
          else
            echo '{"tier4_senders":{},"daily_stats":[]}' > data/sender_history.json
          fi

      - name: Run Weekly Rollup
        if: steps.daycheck.outputs.is_sunday == 'true'
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/weekly_rollup.py
