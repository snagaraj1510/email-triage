name: Morning Brief

on:
  schedule:
    - cron: '0 14 * * *'  # 10am EDT (UTC-4, summer)
    - cron: '0 15 * * *'  # 10am EST (UTC-5, winter)
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  check-time:
    runs-on: ubuntu-latest
    outputs:
      is_10am: ${{ steps.check.outputs.is_10am }}
    steps:
      - id: check
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          echo "is_10am=$( [ "$HOUR" = "10" ] && echo true || echo false )" >> $GITHUB_OUTPUT

  morning-brief:
    needs: check-time
    if: needs.check-time.outputs.is_10am == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write config and credentials
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
          GMAIL_TOKEN_SN10019: ${{ secrets.GMAIL_TOKEN_SN10019 }}
          GMAIL_TOKEN_S_NAGARAJ1510: ${{ secrets.GMAIL_TOKEN_S_NAGARAJ1510 }}
          GMAIL_TOKEN_MULTISTAR1732: ${{ secrets.GMAIL_TOKEN_MULTISTAR1732 }}
          GMAIL_TOKEN_SHREYN_UMICH: ${{ secrets.GMAIL_TOKEN_SHREYN_UMICH }}
        run: |
          printf '%s' "$CONFIG_YAML" > config.yaml
          mkdir -p credentials
          printf '%s' "$GMAIL_TOKEN_SN10019"        > credentials/token_sn10019.json
          printf '%s' "$GMAIL_TOKEN_S_NAGARAJ1510"  > credentials/token_s_nagaraj1510.json
          printf '%s' "$GMAIL_TOKEN_MULTISTAR1732"  > credentials/token_multistar1732.json
          printf '%s' "$GMAIL_TOKEN_SHREYN_UMICH"   > credentials/token_shreyn_umich.json

      - name: Run Morning Brief
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py
